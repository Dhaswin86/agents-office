<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="office3d.js"></script>
<style>
:root {
  --bg: #edf3fd; --panel: #ffffff; --panel-2: #e9f0fc; --line: #d6e1f3; --line-2: #bfcfea;
  --text: #10204a; --muted: #4a5a7e; --faint: #7d8bab;
  --accent: #2457c5; --accent-strong: #1b4499; --accent-soft: #e2ebfc; --accent-line: #a9c1ee;
  --critter: #d97757; --eye: #111522;
  --ok: #3f8f5a; --ok-soft: #e3f2e8; --warn: #b8860b; --warn-soft: #f7eed6; --err: #c4453c; --err-soft: #f8e3e0;
  --scene: #dfe6f2; --scene-2: #d2dbea; --road: #b9c4d6; --road-line: #eef2f8; --card: rgba(255,255,255,.94); --card-line: #c9d3e3;
  --shadow: 0 1px 2px rgba(20,35,70,.06), 0 4px 14px rgba(20,35,70,.06);
  /* --mono is the UI label face (now the readable sans); --code is real monospace, only for code and commands */
  --mono: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --serif: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1430; --panel: #101d3d; --panel-2: #16264d; --line: #22355f; --line-2: #2f4778;
    --text: #e9f0ff; --muted: #a8b7d6; --faint: #7182a8;
    --accent: #7fb0ff; --accent-strong: #a9caff; --accent-soft: #182c58; --accent-line: #34548f;
    --eye: #0a0f1c;
    --ok: #7cc79a; --ok-soft: #132a22; --warn: #ddb25a; --warn-soft: #2e2617; --err: #f08a80; --err-soft: #35191a;
    --scene: #0b1430; --scene-2: #12214a; --road: #222d45; --road-line: #3a4a6b; --card: rgba(17,24,39,.92); --card-line: #2c3a57;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1430; --panel: #101d3d; --panel-2: #16264d; --line: #22355f; --line-2: #2f4778;
  --text: #e9f0ff; --muted: #a8b7d6; --faint: #7182a8;
  --accent: #7fb0ff; --accent-strong: #a9caff; --accent-soft: #182c58; --accent-line: #34548f;
  --eye: #0a0f1c;
  --ok: #7cc79a; --ok-soft: #132a22; --warn: #ddb25a; --warn-soft: #2e2617; --err: #f08a80; --err-soft: #35191a;
  --scene: #0b1430; --scene-2: #12214a; --road: #222d45; --road-line: #3a4a6b; --card: rgba(17,24,39,.92); --card-line: #2c3a57;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
a { color: var(--accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 5; }
.brand { font: 800 22px/1 var(--serif); letter-spacing: -.01em; color: var(--text); display: flex; align-items: baseline; gap: 6px; }
.brand:hover { text-decoration: none; }
.brand sup { display: none; }
.top .org { color: var(--muted); }
.conn { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn i, .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.live { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live.off i { background: var(--err); }
.clock { font: 600 15px var(--serif); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; }
select { font: 12px var(--mono); color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 9px; max-width: 100%; }
.crumb { color: var(--muted); }

/* office layout */
.office { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; min-height: calc(100vh - 57px); }
.floor { position: relative; background: radial-gradient(ellipse at 50% 45%, var(--scene-2), var(--scene) 70%); overflow: hidden;
  display: flex; align-items: center; justify-content: center; padding: 12px 0 36px; }
.floor svg.world { width: 100%; height: auto; aspect-ratio: 1000 / 720; max-height: calc(100vh - 90px); display: block;
  cursor: grab; touch-action: none; user-select: none; }
.floor svg.world.dragging { cursor: grabbing; }
.floor .hint { position: absolute; left: 16px; bottom: 14px; font-size: 11px; color: var(--faint); }
.zoom { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-line); background: var(--card); color: var(--text);
  cursor: pointer; font-size: 16px; display: grid; place-items: center; box-shadow: var(--shadow); }
.zoom button:hover { border-color: var(--accent); }

/* svg scene */
.road { stroke: var(--road); stroke-linecap: round; fill: none; }
.road-line { stroke: var(--road-line); stroke-dasharray: 6 8; fill: none; opacity: .7; }
.road-flow { stroke: var(--accent); stroke-dasharray: 6 10; fill: none; stroke-width: 2.5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.net { fill: none; stroke: var(--accent-line); stroke-width: 1; stroke-dasharray: 2 5; opacity: .8; }
.net.on { stroke: var(--accent); opacity: 1; animation: flow 1.4s linear infinite; }
.packet { fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
.isl { cursor: pointer; }
.isl .face { transition: filter .2s; }
.isl:hover .face { filter: brightness(1.08); }
.isl .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.isl.s-running .sel-ring { opacity: 1; animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 50% { opacity: .25; } }
.crit { transform-box: fill-box; transform-origin: bottom; }
.s-running .crit { animation: bob .4s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-1.5px); } }
.s-waiting .crit { opacity: .6; }
.screen-glow { animation: none; }
.s-running .screen-glow { animation: glow 1.1s steps(2) infinite; }
@keyframes glow { 50% { fill: #b9d6ff; } }
.s-running .drop { animation: drop 1.8s ease-in infinite; transform-box: fill-box; }
@keyframes drop { 0% { transform: translateY(-14px); opacity: 0; } 30% { transform: translateY(0); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
.s-running .paper-flip { animation: flip 1.2s steps(2) infinite; transform-box: fill-box; }
@keyframes flip { 50% { transform: translateY(-2px); } }
.zz { font: 700 11px var(--mono); fill: var(--faint); opacity: 0; }
.s-waiting .zz { animation: zz 3s infinite; }
.s-waiting .zz.z2 { animation-delay: 1.5s; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -16px); } }
.done-flag { opacity: 0; } .s-done .done-flag { opacity: 1; }
/* workers keep working unless their team is waiting (then they doze) */
.isl.s-waiting .worker *, .isl.s-skipped .worker * { animation-play-state: paused !important; }
.isl.s-waiting .worker, .isl.s-skipped .worker { filter: grayscale(.6) brightness(.8); opacity: .75; }
.isl.s-running .wk .lbl-bg { stroke: var(--accent); }
.lbl.role { font-size: 7.5px; }
.lbl { font: 600 8.5px var(--mono); fill: var(--muted); }
.lbl-bg { fill: var(--card); stroke: var(--card-line); }
.hub-node { fill: var(--accent); }
.hub-link { stroke: var(--accent); stroke-width: .8; opacity: .5; }
.hub.busy .hub-node { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .floor * { animation: none !important; } }

/* floating stat cards (foreignObject) */
.card { font: 11px/1.35 var(--mono); color: var(--text); background: var(--card); border: 1px solid var(--card-line); border-radius: 10px;
  padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; backdrop-filter: blur(4px); height: 100%; }
.card:hover { border-color: var(--accent); }
.card.s-running { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.card .t { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; }
.card .t .d { width: 7px; height: 7px; border-radius: 50%; }
.card .big { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 6px; justify-content: center; }
.card .big b { font: 600 28px/1 var(--serif); }
.card .big span { font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.card .m { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
.card .m b { color: var(--text); font-weight: 600; }
.card .dnd { display: flex; gap: 10px; border-top: 1px solid var(--card-line); margin-top: 7px; padding-top: 6px; font-size: 10px; color: var(--faint); }
.card .dnd b { color: var(--text); font-weight: 600; margin-left: 3px; }
.card .st { margin-top: 6px; font-size: 10.5px; display: flex; gap: 6px; align-items: center; }
.card .st .ic { color: var(--accent); }
.card.s-done .st .ic { color: var(--ok); }
.card .wait-flag { margin-top: 6px; font-size: 10px; padding: 2px 6px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); display: inline-block; }
.hubcard { text-align: center; padding: 6px 10px; }
.hubcard .t { justify-content: center; }

/* sidebar */
.side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.side .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.cmd { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; background: var(--panel-2); }
.cmd .row1 { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.cmd .row1 .d { width: 7px; height: 7px; border-radius: 50%; background: var(--critter); }
.cmd code { font-family: var(--code); display: block; margin: 8px 0; font-size: 12.5px; color: var(--accent-strong); word-break: break-all; }
.cmd .row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chipbtn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--muted); }
.chipbtn:hover { border-color: var(--accent); color: var(--text); }
.chipbtn.primary { margin-left: auto; background: var(--accent); border-color: var(--accent); color: #fff; }
.side h2 { margin: 0; font: 600 16px var(--serif); display: flex; justify-content: space-between; align-items: baseline; }
.side h2 small { font: 500 10px var(--mono); color: var(--faint); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.filters button { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; font-size: 10.5px;
  cursor: pointer; color: var(--muted); }
.filters button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.tasks { flex: 1; overflow: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 260px); }
.task { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px;
  align-items: start; background: var(--panel); }
.task:hover { border-color: var(--line-2); }
.task .pill { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-top: 1px; }
.pill.doing { background: var(--accent-soft); color: var(--accent-strong); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.waiting { background: var(--warn-soft); color: var(--warn); }
.pill.skipped { background: var(--panel-2); color: var(--muted); }
.task .txt { font: 12.5px/1.4 var(--sans); color: var(--text); }
.task .sub { grid-column: 2 / 4; font-size: 10.5px; color: var(--faint); }
.task .when { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.task .bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.task .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.empty { color: var(--faint); }

/* 3D room on an agent page */
.stage3d { position: relative; height: 460px; border-radius: 16px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--line);
  background: radial-gradient(ellipse at 50% 40%, var(--scene-2), var(--scene) 75%); }
.stage3d.s-running { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stage3d .s3-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.stage3d .s3-canvas.grab { cursor: grabbing; }
.stage3d .crew { position: absolute; inset: 0; }
.s3-labels { position: absolute; inset: 0; pointer-events: none; }
.s3-tag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 10.5px var(--mono); background: var(--card); border: 1px solid var(--card-line); color: var(--text); padding: 2px 8px; border-radius: 6px; box-shadow: var(--shadow); }
.s-running .s3-tag { border-color: var(--accent); }
.s3-tag .zz { display: none; font-style: normal; color: var(--faint); margin-left: 6px; }
.s3-tag.sleep .zz { display: inline; animation: pulse 1.6s infinite; }
.s3-title { position: absolute; left: 16px; top: 14px; font: 600 15px var(--serif); display: flex; align-items: center; gap: 8px; }
.s3-title .d { width: 9px; height: 9px; border-radius: 50%; background: var(--team); }
.s3-title small { font: 500 10.5px var(--mono); color: var(--faint); }
.s3-ui { position: absolute; right: 14px; top: 12px; display: flex; gap: 6px; }
.s3-ui button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--card-line); background: var(--card); color: var(--text);
  cursor: pointer; font-size: 15px; box-shadow: var(--shadow); }
.s3-ui button:hover, .s3-ui button.on { border-color: var(--accent); color: var(--accent-strong); }
.s3-hint { position: absolute; left: 16px; bottom: 12px; font-size: 11px; color: var(--faint); }
.s3-done { position: absolute; right: 16px; bottom: 12px; font-size: 11px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 3px 9px; border-radius: 999px; }
@media (max-width: 700px) { .stage3d { height: 360px; } }

/* 360° office on the home screen */
.floor3d { padding: 0; display: block; }
.office3d { height: calc(100vh - 57px); min-height: 520px; margin: 0; border-radius: 0; border: 0; }
.office3d .s3-labels { pointer-events: none; }
/* the office's 3D scene is always night-blue, so text drawn straight on it stays light in either theme */
.office3d .s3-title { color: #e9f0ff; } .office3d .s3-hint { color: #a8b7d6; }
.s3-room { position: absolute; left: 0; top: 0; width: 176px; height: auto; padding: 8px 10px; opacity: .96; pointer-events: auto; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.s3-room.hot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.s3-brain { font-size: 10px; }
.s3-room .m, .s3-room .dnd { display: none; }
.s3-room.hot .m, .s3-room:hover .m { display: flex; } .s3-room.hot .dnd, .s3-room:hover .dnd { display: flex; }
.s3-room.hot, .s3-room:hover { z-index: 2; }

.s3-room .big { margin: 2px 0 4px; } .s3-room .big b { font-size: 22px; } .s3-room .dnd { margin-top: 5px; padding-top: 4px; }
@media (max-width: 1000px) { .office3d { height: 72vh; min-height: 440px; } .s3-room { width: 150px; font-size: 10px; } .s3-room .m, .s3-room .dnd { font-size: 9.5px; } }

/* the story */
.story { display: flex; flex-direction: column; gap: 0; }
.ch { border: 1px solid var(--line); border-left: 4px solid var(--team, var(--accent)); border-radius: 12px; padding: 12px 14px; background: var(--panel); }
.ch.s-running { border-color: var(--accent); border-left-color: var(--team); box-shadow: 0 0 0 3px var(--accent-soft); }
.ch.s-waiting { opacity: .7; }
.ch.start { --team: var(--critter); } .ch.finish { --team: var(--faint); } .ch.finish.s-done { --team: var(--ok); }
.ch-head { display: flex; gap: 10px; align-items: flex-start; }
.ch-n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center;
  font: 600 14px var(--serif); color: var(--text); }
.ch-title { font: 15px/1.35 var(--sans); } .ch-title b { font-weight: 700; }
.ch-why { font: 13px/1.45 var(--sans); color: var(--muted); margin-top: 2px; }
.ch-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--faint); margin: 8px 0 4px 38px; }
.steps { list-style: none; margin: 6px 0 0; padding: 0 0 0 38px; display: flex; flex-direction: column; gap: 7px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font: 13px/1.45 var(--sans); }
.steps .pic { font-size: 15px; line-height: 1.3; }
.steps .num { font: 600 10px var(--mono); color: var(--faint); margin-right: 6px; }
.steps .word { font: 600 10px var(--mono); color: var(--accent-strong); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }
.steps .say { display: block; color: var(--text); margin-top: 2px; }
.steps li.live .say::after { content: " …"; color: var(--accent); animation: pulse 1.2s infinite; }
.more { margin: 6px 0 0 38px; border: 1px dashed var(--line-2); background: none; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--muted); cursor: pointer; }
.more:hover { color: var(--text); border-color: var(--accent); }
.ch-end { margin: 10px 0 0 38px; padding: 8px 10px; border-radius: 8px; background: var(--ok-soft); font: 13px/1.45 var(--sans); color: var(--text); }
.ch-end b { font-weight: 600; }
.hand { text-align: center; font-size: 11px; color: var(--faint); padding: 6px 0; }
.sites { margin: 12px 0 0 38px; display: flex; flex-direction: column; gap: 6px; }
.sites-h { font: 600 13px var(--sans); margin-top: 6px; } .sites-h small { font: 400 11px var(--mono); color: var(--faint); margin-left: 6px; }
.site { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel-2); }
.site-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; } .site-top b { font-weight: 600; word-break: break-all; }
.site .cnt { color: var(--faint); flex: none; }
.site-what { font: 12.5px/1.4 var(--sans); color: var(--muted); }
.pages { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.pages a { font-size: 11px; background: var(--panel); border: 1px solid var(--line); padding: 1px 7px; border-radius: 5px; }
.mini { margin: 2px 0 0; padding-left: 18px; font: 12.5px/1.5 var(--sans); color: var(--muted); }
.mini.todo { color: var(--text); margin-left: 38px; }
.storypage h1 { font: 600 30px var(--serif); margin: 0 0 4px; }
.storypage .lead { font: 15px/1.5 var(--sans); color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.story.full .ch { padding: 16px 18px; } .story.full .ch-title { font-size: 17px; } .story.full .steps li { font-size: 14px; }

/* agent page */
.page { max-width: 1180px; margin: 0 auto; padding: 20px 16px 56px; }
.agent-icon { width: 168px; height: 168px; position: relative; }
.agent-icon svg { width: 100%; height: 100%; display: block; }
.s-waiting .agent-icon svg { filter: grayscale(.55) brightness(.85); opacity: .75; }
.crew { display: flex !important; gap: 4px; justify-content: center; align-items: flex-end; padding: 10px; height: auto !important; }
.crew figure { margin: 0; text-align: center; }
.crew .agent-icon { width: 112px; height: 112px; }
.crew .agent-icon svg { --d: inherit; }
.crew figcaption { font-size: 10.5px; color: var(--muted); }
.hero.s-waiting .agent-icon * { animation-play-state: paused !important; }
.hero { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
.hero.s-running { border-color: var(--accent); }
.hero .pen { background: var(--scene); border-radius: 12px; height: 190px; display: grid; place-items: center; position: relative; }
.hero .tick { position: absolute; left: 14px; top: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 12px; }
.hero h1 { margin: 0; font: 600 26px var(--serif); }
.hero .handle { color: var(--faint); font-size: 12.5px; }
.hero .role { margin: 8px 0 10px; color: var(--muted); font: 14px/1.5 var(--sans); }
.status { font-size: 12.5px; display: flex; gap: 7px; align-items: baseline; }
.status .ic { color: var(--accent); } .s-done .status .ic { color: var(--ok); } .s-waiting .status { color: var(--faint); }
.status .verb { color: var(--accent-strong); font-weight: 600; } .status .dim { color: var(--faint); }
.result { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; margin-top: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12.5px; color: var(--faint); margin-top: 12px; }
.meta b { color: var(--text); font-weight: 500; }
.io { font-size: 11.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 10px; }
.chip { background: var(--panel-2); color: var(--muted); padding: 1px 7px; border-radius: 5px; }
.chip.out { background: var(--accent-soft); color: var(--accent-strong); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.panel > .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.panel > .bar b { color: var(--text); font-weight: 600; } .panel > .bar .r { margin-left: auto; color: var(--faint); }
.panel > .body { padding: 14px 16px; max-height: 520px; overflow: auto; }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.log li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 4px 0; }
.log .ic { color: var(--accent); } .log li.last .ic { animation: pulse 1.2s infinite; }
.log .n { color: var(--faint); margin-right: 6px; }
.cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blinkc 1s steps(1) infinite; }
@keyframes blinkc { 50% { opacity: 0; } }
.feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.feed li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; padding: 5px 0; }
.feed .ic { color: var(--accent); } .feed .who { font-weight: 600; margin-right: 6px; } .feed .t { color: var(--faint); font-size: 11.5px; }
.feed .k-done .ic { color: var(--ok); }
.files { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.files li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.files li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.files .fresh { color: var(--accent-strong) !important; } .files .sz { color: var(--faint); flex: none; }
.stepnav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; font-size: 13px; }
.md { font: 14px/1.6 var(--sans); }
.md h1 { font-size: 18px; margin-top: 0; } .md h2 { font-size: 15.5px; margin-top: 1.4em; } .md h3 { font-size: 14px; }
.md code { font: 12.5px var(--code); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--accent-strong); }
.md pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; color: var(--text); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13px; }
.md td, .md th { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.none { border: 1px dashed var(--line-2); border-radius: 12px; padding: 48px 20px; text-align: center; color: var(--muted); margin: 24px; }

@media (max-width: 1000px) {
  .office { grid-template-columns: 1fr; }
  .floor { padding-bottom: 40px; }
  .floor svg.world { max-height: none; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .tasks { max-height: none; }
  .two, .hero { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#/">Agents Office</a>
  <span class="conn"><i></i>Demo data, not a real assignment</span>
  <span class="crumb" id="crumb"></span>
  <div class="right">
    <select id="runSel" aria-label="Assignment run"></select>
    <span class="live" id="live"><i></i><span>live</span></span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</div>
<main id="main"><div class="none">Loading…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = t => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(t, { gfm: true })) : '<pre>' + esc(t) + '</pre>';
const fmtTime = t => t ? t.slice(11, 16) : '';
const dur = (a, b) => {
  if (!a) return '';
  const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000));
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
};
const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
setInterval(() => {
  $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.querySelectorAll('.el[data-start]').forEach(el => { el.textContent = dur(el.dataset.start); });
}, 1000);

// Three workers per team, each an animated icon from /icons (worker 1 uses the team's base icon)
const WORKERS = {
  analyst: [['analyst', 'brief reader'], ['analyst-2', 'planner'], ['analyst-3', 'question sorter']],
  finder:  [['finder', 'web searcher'], ['finder-2', 'doc reader'], ['finder-3', 'source filer']],
  builder: [['builder', 'maker'], ['builder-2', 'coder'], ['builder-3', 'tester']],
};
const ICONS = {}, INNER = {};
const iconsReady = Promise.all(Object.values(WORKERS).flat().map(([file]) =>
  fetch('icons/' + file + '.svg').then(r => r.ok ? r.text() : '').then(t => {
    ICONS[file] = t;
    INNER[file] = t.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  }).catch(() => {})));

const TEAM = {
  analyst: { top: '#5f9a6b', left: '#3f6e4a', right: '#4d845a', dot: '#7cc79a', verb: 'Analysing' },
  finder:  { top: '#4f7fb5', left: '#33577f', right: '#41699a', dot: '#8fb3ff', verb: 'Searching' },
  builder: { top: '#c39a48', left: '#87672a', right: '#a5813a', dot: '#e9b949', verb: 'Building' },
};
const SPIN = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
let spinI = 0;
setInterval(() => { spinI = (spinI + 1) % SPIN.length; document.querySelectorAll('.spin').forEach(el => el.textContent = SPIN[spinI]); }, 120);

function logItems(text) {
  return (text || '').split('\n').filter(l => /^\s*[-*]\s+/.test(l)).map(l => {
    const m = l.replace(/^\s*[-*]\s+/, '').match(/^\*\*(.+?)\*\*\s*(.*)$/);
    return m ? { n: m[1], t: m[2] } : { n: '', t: l.replace(/^\s*[-*]\s+/, '') };
  });
}

// Real numbers per agent, read from its files
function metrics(s, a) {
  const out = a.outputText || '';
  if (a.id === 'analyst') {
    const items = (out.match(/^\s*- \[[ xX]\]/gm) || []).length;
    const blocking = /BLOCKING:\s*yes/i.test(out) ? 'yes' : out ? 'no' : '–';
    return [['checklist items', items || '–'], ['blocking', blocking]];
  }
  if (a.id === 'finder') {
    const urls = new Set(out.match(/https?:\/\/[^\s)>\]]+/g) || []);
    const gaps = (out.split(/^##\s*Gaps.*$/im)[1] || '').split(/^##\s/m)[0];
    return [['sources found', urls.size || '–'], ['gaps', out ? (gaps.match(/^\s*[-*]\s+/gm) || []).length : '–']];
  }
  const del = s.files.filter(f => f.path.startsWith('deliverables/')).length;
  const all = (out.match(/^\s*- \[[ xX]\]/gm) || []).length, ticked = (out.match(/^\s*- \[[xX]\]/gm) || []).length;
  return [['deliverables', del || '–'], ['checks ticked', all ? `${ticked} / ${all}` : '–']];
}

/* ---------- isometric drawing ---------- */
const P = (cx, cy, i, j) => [cx + (i - j), cy + (i + j) / 2];
const pts = arr => arr.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
function isoBox(cx, cy, w, d, h, top, left, right, cls = '') {
  const a = P(cx, cy, -w / 2, -d / 2), b = P(cx, cy, w / 2, -d / 2), c = P(cx, cy, w / 2, d / 2), e = P(cx, cy, -w / 2, d / 2);
  const up = p => [p[0], p[1] - h];
  return `<g class="${cls}"><polygon class="face" points="${pts([e, c, up(c), up(e)])}" fill="${left}"/>
    <polygon class="face" points="${pts([c, b, up(b), up(c)])}" fill="${right}"/>
    <polygon class="face" points="${pts([up(a), up(b), up(c), up(e)])}" fill="${top}"/></g>`;
}
const critterSym = `<symbol id="crit" viewBox="-2 0 12 8" shape-rendering="crispEdges">
  <rect x="0" y="0" width="8" height="6" fill="#d97757"/><rect x="-2" y="2" width="2" height="2" fill="#d97757"/><rect x="8" y="2" width="2" height="2" fill="#d97757"/>
  <rect x="0" y="6" width="1" height="2" fill="#d97757"/><rect x="2" y="6" width="1" height="2" fill="#d97757"/><rect x="5" y="6" width="1" height="2" fill="#d97757"/><rect x="7" y="6" width="1" height="2" fill="#d97757"/>
  <rect x="2" y="1" width="1" height="1" fill="#111522"/><rect x="5" y="1" width="1" height="1" fill="#111522"/></symbol>`;

// Scene layout (viewBox 1000 x 640)
const HUB = { x: 500, y: 385, s: 66 };
const SPOTS = {
  analyst: { x: 245, y: 300, s: 140, card: [36, 16, 205, 150] },
  finder:  { x: 755, y: 300, s: 140, card: [759, 16, 205, 150] },
  builder: { x: 500, y: 585, s: 140, card: [740, 520, 205, 150] },
};

function props(id, cx, cy, t) {
  if (id === 'analyst') return isoBox(cx + 30, cy + 4, 16, 14, 5, '#f4efe4', '#cfc6b4', '#e2dace', 'paper-flip')
    + isoBox(cx + 30, cy - 1, 16, 14, 4, '#ffffff', '#d8d0c0', '#ece6da')
    + isoBox(cx - 34, cy + 16, 10, 10, 18, '#7a5a3b', '#5a412a', '#6b4e33') + `<circle cx="${cx - 34}" cy="${cy - 2}" r="9" fill="#4f8a5b"/>`;
  if (id === 'finder') return isoBox(cx + 2, cy - 8, 4, 22, 20, '#3a3f48', '#2a2e35', '#30353d')
    + `<polygon class="screen-glow" points="${pts([P(cx + 4, cy - 8, 0, -10), P(cx + 4, cy - 8, 0, 10), [P(cx + 4, cy - 8, 0, 10)[0], P(cx + 4, cy - 8, 0, 10)[1] - 17], [P(cx + 4, cy - 8, 0, -10)[0], P(cx + 4, cy - 8, 0, -10)[1] - 17]])}" fill="#7fb2ff"/>`
    + isoBox(cx + 34, cy + 12, 12, 12, 26, '#566278', '#3c4556', '#485366');
  return isoBox(cx + 30, cy + 10, 14, 14, 9, '#d9a066', '#a87440', '#c0874f') + isoBox(cx + 44, cy + 3, 14, 14, 9, '#d9a066', '#a87440', '#c0874f')
    + isoBox(cx + 37, cy - 3, 14, 14, 9, '#e3ad75', '#a87440', '#c0874f', 'drop')
    + isoBox(cx - 36, cy + 14, 14, 10, 6, '#e9b949', '#b28a2e', '#cfa23c');
}

function island(s, a, idx) {
  const sp = SPOTS[a.id], T = TEAM[a.id], half = sp.s / 2;
  const top = [P(sp.x, sp.y, -half, -half), P(sp.x, sp.y, half, -half), P(sp.x, sp.y, half, half), P(sp.x, sp.y, -half, half)];
  const plantAt = P(sp.x, sp.y, -half + 9, half - 9);
  const plant = isoBox(plantAt[0], plantAt[1], 9, 9, 9, '#6b4e33', '#4d3825', '#5c4430')
    + `<circle cx="${plantAt[0]}" cy="${plantAt[1] - 16}" r="8" fill="#3f8a55"/><circle cx="${plantAt[0] + 5}" cy="${plantAt[1] - 21}" r="5" fill="#57a86b"/>`;
  // three workstations: back-left, back-right, front-centre (drawn back to front)
  const spots = [[-64, -4], [64, -4], [0, 38]];
  const W = 86;
  const workers = WORKERS[a.id].map(([file, role], k) => {
    const [dx, dy] = spots[k], ax = sp.x + dx, ay = sp.y + dy;
    const tagW = role.length * 4.9 + 10;
    return `<g class="wk">
      <svg class="worker" x="${ax - W / 2}" y="${ay - W + 6}" width="${W}" height="${W}" viewBox="0 0 32 32" shape-rendering="crispEdges"
        style="--d:${-(k * 1.37 + idx * .61).toFixed(2)}s">${INNER[file] || ''}</svg>
      <rect class="lbl-bg" x="${ax - tagW / 2}" y="${ay - W - 2}" width="${tagW}" height="11" rx="3"/>
      <text class="lbl role" x="${ax}" y="${ay - W + 6}" text-anchor="middle">${esc(role)}</text>
    </g>`;
  }).join('');
  return `<g class="isl s-${a.state}" data-go="${a.id}">
    ${isoBox(sp.x, sp.y + 14, sp.s, sp.s, 14, T.top, T.left, T.right)}
    <polygon class="sel-ring" points="${pts(top)}"/>
    ${plant}${workers}
    <text class="zz" x="${sp.x + 10}" y="${sp.y - 48}">z</text><text class="zz z2" x="${sp.x + 18}" y="${sp.y - 56}">Z</text>
    <g class="done-flag"><circle cx="${sp.x}" cy="${sp.y - 74}" r="7" fill="#3f8f5a"/><path d="M${sp.x - 3} ${sp.y - 74} l2 2.4 l4 -4.6" stroke="#fff" stroke-width="1.6" fill="none"/></g>
  </g>`;
}

function card(s, a) {
  const [x, y, w, h] = SPOTS[a.id].card;
  return `<foreignObject x="${x}" y="${y}" width="${w}" height="${h}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="card s-${a.state}" data-go="${a.id}">${cardBody(s, a)}</div></foreignObject>`;
}
function cardBody(s, a) {
  const T = TEAM[a.id], m = metrics(s, a);
  const steps = logItems(a.logText).length;
  const doing = a.state === 'running' ? 1 : 0, next = a.state === 'waiting' ? 1 : 0;
  const st = a.state === 'running' ? `<span class="ic spin">${SPIN[spinI]}</span><span>${T.verb}… <span style="color:var(--faint)" class="el" data-start="${esc(a.started)}">${dur(a.started)}</span></span>`
    : a.state === 'done' ? `<span class="ic">⏺</span><span>Done in ${dur(a.started, a.finished)}</span>`
    : a.state === 'skipped' ? '<span class="ic">⊘</span><span>Skipped</span>' : '<span class="ic" style="color:var(--faint)">○</span><span style="color:var(--faint)">Waiting</span>';
  return `
      <div class="t"><span class="d" style="background:${T.dot}"></span>${esc(a.label)}</div>
      <div class="big"><b>${steps}</b><span>steps</span></div>
      ${m.map(([k, v]) => `<div class="m"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
      <div class="dnd"><span>doing<b>${doing}</b></span><span>next<b>${next}</b></span><span>done<b>${a.state === 'done' ? steps : Math.max(0, steps - doing)}</b></span></div>
      <div class="st">${st}</div>`;
}

function office(s) {
  const ag = s.agents, busy = ag.some(a => a.state === 'running');
  const roads = ag.map(a => {
    const sp = SPOTS[a.id], d = `M${HUB.x} ${HUB.y} L${sp.x} ${sp.y}`;
    return `<path class="road" d="${d}" stroke-width="26"/><path class="road-line" d="${d}" stroke-width="1.5"/>
      ${a.state === 'running' ? `<path class="road-flow" d="${d}"/><circle class="packet" r="4.5"><animateMotion dur="1.8s" repeatCount="indefinite" path="${d}"/></circle>` : ''}`;
  }).join('');
  const nets = ag.map(a => {
    const sp = SPOTS[a.id], [x, y, w, h] = sp.card, cx = x + w / 2, cy = y + h;
    const ty = cy > sp.y ? y : cy;
    return `<path class="net ${a.state === 'running' ? 'on' : ''}" d="M${HUB.x} ${HUB.y - 24} Q ${(HUB.x + cx) / 2} ${Math.min(HUB.y, ty) - 60} ${cx} ${ty}"/>
      <path class="net" d="M${sp.x} ${sp.y - 40} L${cx} ${ty}"/>`;
  }).join('');
  const nodes = [[-18, -6], [10, -12], [22, 4], [-4, 10], [-24, 8], [4, -2]].map(([dx, dy]) => [HUB.x + dx, HUB.y + dy]);
  const hubLinks = nodes.flatMap((n, i) => nodes.slice(i + 1).map(m => `<line class="hub-link" x1="${n[0]}" y1="${n[1]}" x2="${m[0]}" y2="${m[1]}"/>`)).join('');
  return `<svg class="world" id="world" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet">
    <defs>${critterSym}</defs>
    <g id="cam">
      ${nets}${roads}
      <g class="hub ${busy ? 'busy' : ''}">
        ${isoBox(HUB.x, HUB.y + 10, HUB.s * 1.6, HUB.s * 1.6, 10, '#2f3a52', '#1d2538', '#253049')}
        ${hubLinks}${nodes.map(n => `<circle class="hub-node" cx="${n[0]}" cy="${n[1]}" r="2.4"/>`).join('')}
      </g>
      ${ag.map((a, i) => island(s, a, i)).join('')}
      <foreignObject x="${HUB.x - 95}" y="${HUB.y - 84}" width="190" height="34">
        <div xmlns="http://www.w3.org/1999/xhtml" class="card hubcard"><div class="t"><span class="d" style="background:var(--accent)"></span>The Brain · ${s.events.length} notes</div></div>
      </foreignObject>
      ${ag.map(a => card(s, a)).join('')}
    </g>
  </svg>`;
}

/* ---------- task status sidebar ---------- */
let filter = 'all';
function tasks(s) {
  const out = [];
  s.agents.forEach(a => {
    const items = logItems(a.logText);
    items.forEach((it, i) => {
      const live = a.state === 'running' && i === items.length - 1;
      out.push({ st: live ? 'doing' : 'done', txt: it.t, agent: a.label, out: a.output, n: it.n, when: live ? 'now' : (a.finished ? fmtTime(a.finished) : '') });
    });
    if (a.state === 'running' && !items.length) out.push({ st: 'doing', txt: 'Getting started…', agent: a.label, out: a.output, when: 'now' });
    if (a.state === 'waiting') out.push({ st: 'waiting', txt: `Write ${a.output}`, agent: a.label, out: a.output, when: 'next' });
    if (a.state === 'skipped') out.push({ st: 'skipped', txt: a.summary || 'Skipped by AI policy', agent: a.label, out: a.output, when: '' });
  });
  return out.reverse();
}
function sidebar(s) {
  const all = tasks(s), count = k => all.filter(t => t.st === k).length;
  const shown = filter === 'all' ? all : all.filter(t => t.st === filter);
  const f = (k, label, n) => `<button data-filter="${k}" class="${filter === k ? 'on' : ''}">${label} ${n}</button>`;
  return `<aside class="side">
    <div class="sec"><div class="cmd">
      <div class="row1"><span class="d"></span>Start the next assignment</div>
      <code id="cmdText">/thriveni-assignment</code>
      <div class="row2"><span class="chipbtn" title="What Thriveni allows for this assignment">AI help: ${esc(String(s.aiPolicy).replace('_', ' '))}</span>
        <button class="chipbtn primary" id="copyCmd">Copy command</button></div>
    </div></div>
    <div class="sec"><h2>What happened <small><a href="#/story">Open the full story</a></small></h2>
      <div class="filters"><button data-mode="story" class="${mode === 'story' ? 'on' : ''}">📖 story</button><button data-mode="list" class="${mode === 'list' ? 'on' : ''}">☰ list</button></div>
      ${mode === 'list' ? `<div class="filters">${f('all', 'all', all.length)}${f('doing', 'doing', count('doing'))}${f('waiting', 'waiting', count('waiting'))}${f('done', 'done', count('done'))}</div>` : ''}</div>
    <div class="tasks">${mode === 'story' ? story(s, false) : shown.length ? shown.map(t => `<div class="task">
      <span class="pill ${t.st}">${t.st}</span><span class="txt">${esc(t.txt)}</span><span class="when">${esc(t.when)}</span>
      ${t.st === 'doing' ? '<div class="bar"><i></i></div>' : ''}
      <span class="sub">${esc(t.agent)} · ${esc(t.out)}${t.n ? ' · ' + esc(t.n) : ''}</span></div>`).join('') : '<p class="empty">Nothing here.</p>'}</div>
  </aside>`;
}

/* ---------- the story: the whole run told simply, start to end ---------- */
let mode = 'story';
const openCh = new Set();
const KID = {
  analyst: { done: 'read the homework and made a to-do list', running: 'is reading the homework', waiting: 'will read the homework first',
    why: 'Like reading the question twice before you start, so nothing gets missed.' },
  finder: { done: 'looked things up', running: 'is looking things up', waiting: 'will look things up next',
    why: 'It visits websites and your old work to find help for every item on the to-do list.' },
  builder: { done: 'did the work and checked it', running: 'is doing the work', waiting: 'will do the work last',

      // re-render only when the data changes, so the workers' animations run uninterrupted
      const sig = JSON.stringify(current) + route() + filter;
      if (sig !== lastSig && !drag) { render(current); lastSig = sig; }
    }
    $('#live').classList.remove('off'); $('#live span').textContent = 'live';
  } catch (e) {
    $('#live').classList.add('off'); $('#live span').textContent = 'offline';
  }
}
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { if (z.dataset.zoom === 'reset') { cam.k = 1; cam.x = 0; cam.y = 0; applyCam(); } else zoomBy(z.dataset.zoom === 'in' ? 1.2 : 1 / 1.2); return; }
  const m = e.target.closest('[data-mode]');
  if (m) { mode = m.dataset.mode; lastSig = ''; if (current) render(current); return; }
  const o = e.target.closest('[data-open]');
  if (o) { openCh.add(o.dataset.open); lastSig = ''; if (current) render(current); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { filter = f.dataset.filter; if (current) render(current); return; }
  if (e.target.closest('#copyCmd')) {
    const t = $('#cmdText').textContent, b = $('#copyCmd');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'Copied'; }, () => { b.textContent = 'Select it and copy'; });
    setTimeout(() => { if ($('#copyCmd')) $('#copyCmd').textContent = 'Copy command'; }, 1500);
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g && !moved) location.hash = '#/' + g.dataset.go;
});
window.addEventListener('hashchange', () => { if (current) { render(current); lastSig = ''; window.scrollTo(0, 0); } });
$('#runSel').addEventListener('change', e => {
  runId = +e.target.value; lastSig = '';
  try { localStorage.setItem('pipe.run', runId); } catch (err) {}
  tick();
});
iconsReady.then(() => { tick(); setInterval(tick, 2000); });
</script>
</body>
