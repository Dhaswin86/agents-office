<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Analyst reading the brief">
<title>Analyst reading the brief</title>
<style>
.an-eyes { animation: an-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes an-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.an-scan { animation: an-scan 4s steps(5) infinite; animation-delay: var(--d, 0s); }
@keyframes an-scan { from { transform: translateY(0); } to { transform: translateY(10px); } }
.an-chk { opacity: 0; animation: an-chk 4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes an-chk { 0% { opacity: 0; } 20%, 99% { opacity: 1; } 100% { opacity: 0; } }
.an-arm { animation: an-arm 1s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes an-arm { 50% { transform: translateY(-1px); } }
</style>
