<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Source finder searching on a computer">
<title>Source finder searching on a computer</title>
<style>
.fi-eyes { animation: fi-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes fi-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.fi-key { opacity: 0; animation: fi-key 4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes fi-key { 0% { opacity: 0; } 4%, 96% { opacity: 1; } 100% { opacity: 0; } }
.fi-res { opacity: 0; animation: fi-res 4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes fi-res { 0% { opacity: 0; } 6%, 70% { opacity: 1; } 71%, 100% { opacity: 0; } }
.fi-caret { animation: fi-caret .8s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes fi-caret { 50% { opacity: 0; } }
.fi-type { animation: fi-type .3s steps(1) infinite; animation-delay: var(--d, 0s); }
.fi-type2 { animation: fi-type .3s steps(1) infinite reverse; animation-delay: var(--d, 0s); }
@keyframes fi-type { 50% { transform: translateY(-1px); } }
.fi-bulb rect { animation: fi-bulb .7s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes fi-bulb { 50% { fill: #fff3c4; } }
</style>
