<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Tester checking and packing">
<title>Tester checking and packing</title>
<style>
.te-eyes { animation: te-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes te-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.te-seq { opacity: 0; animation: te-seq 4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes te-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.te-fl, .te-fr { transform-box: fill-box; transform-origin: 50% 100%; animation: te-flap 4s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes te-flap { 0%, 45% { transform: scaleY(1); } 60%, 92% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
.te-tape { opacity: 0; animation: te-tape 4s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes te-tape { 0%, 64% { opacity: 0; } 65%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }
.te-bob { animation: te-bob .8s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes te-bob { 50% { transform: translateY(-.5px); } }
</style>
<rect x="17" y="15" width="11" height="8" fill="#c4834d"/><rect x="17" y="15" width="11" height="1" fill="#a86d3c"/><rect x="17" y="22" width="11" height="1" fill="#a86d3c"/><g class="te-fl"><rect x="17" y="12" width="5" height="3" fill="#d9a066"/></g><g class="te-fr"><rect x="23" y="12" width="5" height="3" fill="#d9a066"/></g><g class="te-tape"><rect x="21" y="15" width="3" height="8" fill="#e9b949"/></g><g class="te-bob"><rect x="2" y="16" width="8" height="6" fill="#d97757"/><rect x="0" y="18" width="2" height="2" fill="#d97757"/><rect x="10" y="18" width="2" height="2" fill="#d97757"/><rect x="2" y="22" width="1" height="2" fill="#d97757"/><rect x="4" y="22" width="1" height="2" fill="#d97757"/><rect x="7" y="22" width="1" height="2" fill="#d97757"/><rect x="9" y="22" width="1" height="2" fill="#d97757"/><g class="te-eyes"><rect x="7" y="17" width="1" height="1" fill="#1d1b18"/><rect x="9" y="17" width="1" height="1" fill="#1d1b18"/></g><rect x="1" y="15" width="10" height="1" fill="#c99a2e"/><rect x="3" y="14" width="6" height="1" fill="#e9b949"/><rect x="4" y="13" width="4" height="1" fill="#e9b949"/><rect x="11" y="13" width="5" height="7" fill="#8a5a3b"/><rect x="12" y="14" width="3" height="5" fill="#f4efe4"/><rect x="13" y="15" width="2" height="1" fill="#c9bfae"/><rect x="13" y="17" width="2" height="1" fill="#c9bfae"/><g class="te-seq" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="12" y="15" width="1" height="1" fill="#6fbf5f"/></g><g class="te-seq" style="animation-delay:calc(var(--d, 0s) + 0.9s)"><rect x="12" y="17" width="1" height="1" fill="#6fbf5f"/></g></g>
</svg>
