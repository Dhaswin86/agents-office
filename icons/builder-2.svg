<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Coder writing code on a laptop">
<title>Coder writing code on a laptop</title>
<style>
.co-eyes { animation: co-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes co-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.co-seq { opacity: 0; animation: co-seq 4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes co-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.co-ta { animation: co-type .3s steps(1) infinite; animation-delay: var(--d, 0s); }
.co-tb { animation: co-type .3s steps(1) infinite reverse; animation-delay: var(--d, 0s); }
@keyframes co-type { 50% { transform: translateY(-1px); } }
</style>
<rect x="15" y="9" width="11" height="9" fill="#3a3f48"/><rect x="16" y="10" width="9" height="7" fill="#1e2a38"/><rect x="13" y="19" width="15" height="2" fill="#b8bec4"/><rect x="15" y="18" width="11" height="1" fill="#8d939a"/><g class="co-seq" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="17" y="11" width="4" height="1" fill="#8fb3ff"/></g><g class="co-seq" style="animation-delay:calc(var(--d, 0s) + 0.6s)"><rect x="18" y="12" width="5" height="1" fill="#e9b949"/></g><g class="co-seq" style="animation-delay:calc(var(--d, 0s) + 1.2s)"><rect x="18" y="13" width="3" height="1" fill="#d97757"/></g><g class="co-seq" style="animation-delay:calc(var(--d, 0s) + 1.8s)"><rect x="17" y="14" width="6" height="1" fill="#8fb3ff"/></g><g class="co-seq" style="animation-delay:calc(var(--d, 0s) + 2.4s)"><rect x="17" y="15" width="1" height="1" fill="#6fbf5f"/><rect x="18" y="16" width="1" height="1" fill="#6fbf5f"/><rect x="19" y="15" width="1" height="1" fill="#6fbf5f"/><rect x="20" y="14" width="1" height="1" fill="#6fbf5f"/><rect x="22" y="15" width="2" height="1" fill="#6fbf5f"/></g><rect x="2" y="15" width="8" height="6" fill="#d97757"/><rect x="0" y="17" width="2" height="2" fill="#d97757"/><rect x="10" y="17" width="2" height="2" fill="#d97757"/><g class="co-eyes"><rect x="7" y="16" width="1" height="1" fill="#1d1b18"/><rect x="9" y="16" width="1" height="1" fill="#1d1b18"/></g><rect x="1" y="14" width="10" height="1" fill="#c99a2e"/><rect x="3" y="13" width="6" height="1" fill="#e9b949"/><rect x="4" y="12" width="4" height="1" fill="#e9b949"/><rect x="1" y="21" width="30" height="2" fill="#a06b47"/><rect x="2" y="23" width="28" height="7" fill="#8a5a3b"/><rect x="13" y="25" width="6" height="1" fill="#6e4a31"/><rect x="2" y="29" width="28" height="1" fill="#6e4a31"/><g class="co-ta"><rect x="11" y="18" width="2" height="1" fill="#d97757"/></g><g class="co-tb"><rect x="14" y="18" width="2" height="1" fill="#d97757"/></g>
</svg>
