<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Builder building a wall">
<title>Builder building a wall</title>
<style>
.bu-eyes { animation: bu-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes bu-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.bu-hammer { transform-box: view-box; transform-origin: 12.5px 19px; animation: bu-swing .6s ease-in infinite; animation-delay: var(--d, 0s); }
@keyframes bu-swing { 0% { transform: rotate(-45deg); } 55% { transform: rotate(38deg); } 70% { transform: rotate(32deg); } 100% { transform: rotate(-45deg); } }
.bu-spark { opacity: 0; animation: bu-spark .6s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes bu-spark { 0%, 54% { opacity: 0; } 55%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
.bu-blk { opacity: 0; animation: bu-blk 4.2s ease-out infinite both; animation-delay: var(--d, 0s); }
@keyframes bu-blk { 0% { opacity: 0; transform: translateY(-4px); } 6% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 86%, 100% { opacity: 0; } }
.bu-bob { animation: bu-bob .6s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes bu-bob { 50% { transform: translateY(-.5px); } }
</style>
<rect x="0" y="24" width="32" height="2" fill="#5b544a"/><rect x="0" y="26" width="32" height="6" fill="#4a443c"/><g class="bu-blk" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="16" y="21" width="6" height="3" fill="#d9a066"/><rect x="16" y="21" width="6" height="1" fill="#e8b98a"/><rect x="21" y="21" width="1" height="3" fill="#b8794a"/><rect x="16" y="23" width="6" height="1" fill="#b8794a"/></g><g class="bu-blk" style="animation-delay:calc(var(--d, 0s) + 0.6s)"><rect x="22" y="21" width="6" height="3" fill="#d9a066"/><rect x="22" y="21" width="6" height="1" fill="#e8b98a"/><rect x="27" y="21" width="1" height="3" fill="#b8794a"/><rect x="22" y="23" width="6" height="1" fill="#b8794a"/></g><g class="bu-blk" style="animation-delay:calc(var(--d, 0s) + 1.2s)"><rect x="19" y="18" width="6" height="3" fill="#d9a066"/><rect x="19" y="18" width="6" height="1" fill="#e8b98a"/><rect x="24" y="18" width="1" height="3" fill="#b8794a"/><rect x="19" y="20" width="6" height="1" fill="#b8794a"/></g><g class="bu-blk" style="animation-delay:calc(var(--d, 0s) + 1.8s)"><rect x="16" y="15" width="6" height="3" fill="#d9a066"/><rect x="16" y="15" width="6" height="1" fill="#e8b98a"/><rect x="21" y="15" width="1" height="3" fill="#b8794a"/><rect x="16" y="17" width="6" height="1" fill="#b8794a"/></g><g class="bu-blk" style="animation-delay:calc(var(--d, 0s) + 2.4s)"><rect x="22" y="15" width="6" height="3" fill="#d9a066"/><rect x="22" y="15" width="6" height="1" fill="#e8b98a"/><rect x="27" y="15" width="1" height="3" fill="#b8794a"/><rect x="22" y="17" width="6" height="1" fill="#b8794a"/></g><g class="bu-bob"><rect x="2" y="16" width="8" height="6" fill="#d97757"/><rect x="0" y="18" width="2" height="2" fill="#d97757"/><rect x="10" y="18" width="2" height="2" fill="#d97757"/><rect x="2" y="22" width="1" height="2" fill="#d97757"/><rect x="4" y="22" width="1" height="2" fill="#d97757"/><rect x="7" y="22" width="1" height="2" fill="#d97757"/><rect x="9" y="22" width="1" height="2" fill="#d97757"/><g class="bu-eyes"><rect x="6" y="17" width="1" height="1" fill="#1d1b18"/><rect x="9" y="17" width="1" height="1" fill="#1d1b18"/></g><rect x="1" y="15" width="10" height="1" fill="#c99a2e"/><rect x="3" y="14" width="6" height="1" fill="#e9b949"/><rect x="4" y="13" width="4" height="1" fill="#e9b949"/><g class="bu-hammer"><rect x="12" y="13" width="1" height="6" fill="#8a5a3b"/><rect x="11" y="11" width="4" height="2" fill="#b8bec4"/><rect x="14" y="11" width="1" height="2" fill="#8d939a"/></g></g><g class="bu-spark"><rect x="16" y="13" width="1" height="1" fill="#ffd166"/><rect x="18" y="12" width="1" height="1" fill="#ffd166"/><rect x="17" y="11" width="1" height="1" fill="#fff3c4"/></g>
</svg>
